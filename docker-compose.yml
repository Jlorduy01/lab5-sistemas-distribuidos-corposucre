# docker-compose.yml — ESQUELETO PROVISTO / COMPLETAR POR EL ESTUDIANTE
#
# La topología de servicios (cuáles existen y cómo se llaman) SÍ se
# entrega. Lo que falta completar son las variables de entorno,
# healthchecks y el Dockerfile propio de vista_unificada/.

version: "3.8"

services:

  pg_ips:
    image: postgres:16
    container_name: pg_ips
    environment:
      POSTGRES_USER: ips_admin
      # TODO(estudiante): definir una contraseña propia (no dejar en blanco)
      POSTGRES_PASSWORD: "CAMBIAR_ESTA_CLAVE"
      POSTGRES_MULTIPLE_DATABASES: "historia_clinica_sede1,historia_clinica_sede2,historia_clinica_sede3,fhir_db"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - pg_ips_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # TODO(estudiante, opcional): agregar healthcheck con pg_isready

  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: hapi-fhir
    depends_on:
      - pg_ips
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg_ips:5432/fhir_db
      SPRING_DATASOURCE_USERNAME: ips_admin
      SPRING_DATASOURCE_PASSWORD: "CAMBIAR_ESTA_CLAVE"
      # Limitar memoria para entornos de laboratorio con recursos acotados
      JAVA_TOOL_OPTIONS: "-Xmx400m"
    ports:
      - "8080:8080"

  vista-unificada:
    # TODO(estudiante): construir la imagen a partir de vista_unificada/Dockerfile
    # (no se entrega el Dockerfile: es parte del checklist de entorno).
    build:
      context: ./vista_unificada
    container_name: vista-unificada
    depends_on:
      - pg_ips
      - hapi-fhir
    environment:
      DB_HOST: pg_ips
      DB_USER: ips_admin
      DB_PASSWORD: "CAMBIAR_ESTA_CLAVE"
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
    ports:
      - "5000:5000"

volumes:
  pg_ips_data:
